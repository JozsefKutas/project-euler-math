[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-euler-math"
version = "1.0.0"
description = "A library of maths functions used to solve Project Euler problems, written in pure Python"
authors = [{ name = "Jozsef", email = "joz.kutas@gmail.com" }]
requires-python = ">=3.14,<4"
dependencies = [
    "black>=25.12.0",
]

[dependency-groups]
dev = ["pytest>=5.2,<6"]

[tool.uv.workspace]
members = [
    "project-euler-math",
]
